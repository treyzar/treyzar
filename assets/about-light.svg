<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Обо мне: Python-разработчик. Делаю бэкенд коммерческих продуктов: REST API, Telegram-боты, фоновые задачи и аналитику. Проектирую схему данных и API-контракты, пишу тесты и довожу сервисы до продакшна в Docker."><title>Обо мне: Python-разработчик. Делаю бэкенд коммерческих продуктов: REST API, Telegram-боты, фоновые задачи и аналитику. Проектирую схему данных и API-контракты, пишу тесты и довожу сервисы до продакшна в Docker.</title><style>
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.ring.d{animation-delay:1.1s}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.packet{offset-rotate:0deg;opacity:0;animation:move var(--dur,2.6s) cubic-bezier(.5,0,.5,1) infinite;animation-delay:var(--delay,0s)}
@keyframes move{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.halo{animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.15}50%{opacity:.6}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shine{animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{transform:translateY(-120px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(320px);opacity:0}}
.in{opacity:0;animation:in .6s ease-out forwards;animation-delay:var(--delay,0s)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.packet{opacity:0}}
</style><rect width="1200" height="330" rx="16" fill="#f6f8fa" stroke="#d0d7de"/><text x="56" y="64" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="600" fill="#9a6700" text-anchor="start" letter-spacing="2">ОБО МНЕ</text><text x="56" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2328" text-anchor="start">Бэкенд, который доходит до прода</text><text x="56" y="170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#59636e" text-anchor="start">Python-разработчик. Делаю бэкенд коммерческих продуктов:</text><text x="56" y="204" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#59636e" text-anchor="start">REST API, Telegram-боты, фоновые задачи и аналитику.</text><text x="56" y="238" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#59636e" text-anchor="start">Проектирую схему данных и API-контракты, пишу тесты</text><text x="56" y="272" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#59636e" text-anchor="start">и довожу сервисы до продакшна в Docker.</text><path d="M800 48V282" stroke="#d0d7de" stroke-width="1.5"/><g class="in" style="--delay:0.10s"><rect x="840" y="68" width="44" height="44" rx="10" fill="#ffffff" stroke="#d0d7de"/><svg x="851.0" y="79.0" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9a6700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
