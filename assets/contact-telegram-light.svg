<svg xmlns="http://www.w3.org/2000/svg" width="176" height="52" viewBox="0 0 176 52" role="img" aria-label="Telegram"><title>Telegram</title><style>
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.ring.d{animation-delay:1.1s}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.packet{offset-rotate:0deg;opacity:0;animation:move var(--dur,2.6s) cubic-bezier(.5,0,.5,1) infinite;animation-delay:var(--delay,0s)}
@keyframes move{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.halo{animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.15}50%{opacity:.6}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shine{animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{transform:translateY(-120px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(320px);opacity:0}}
.in{opacity:0;animation:in .6s ease-out forwards;animation-delay:var(--delay,0s)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.packet{opacity:0}}
</style><rect x="1" y="1" width="174" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><svg x="20.0" y="15.0" width="22" height="22" viewBox="0 0 24 24" fill="#9a6700"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg><text x="56" y="32" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="400" fill="#1f2328" text-anchor="start">Telegram</text></svg>
