<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="SMIP Platform: SaaS-аналитика для контент-команд. REST API, JWT с ротацией refresh-сессий, парсинг соцсетей через RabbitMQ, outbox и DLQ."><title>SMIP Platform: SaaS-аналитика для контент-команд. REST API, JWT с ротацией refresh-сессий, парсинг соцсетей через RabbitMQ, outbox и DLQ.</title><style>
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
.ring.d{animation-delay:1.1s}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.2);opacity:0}}
.flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.packet{offset-rotate:0deg;opacity:0;animation:move var(--dur,2.6s) cubic-bezier(.5,0,.5,1) infinite;animation-delay:var(--delay,0s)}
@keyframes move{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
.halo{animation:halo 2.6s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.15}50%{opacity:.6}}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shine{animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%{transform:translateY(-120px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(320px);opacity:0}}
.in{opacity:0;animation:in .6s ease-out forwards;animation-delay:var(--delay,0s)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}.packet{opacity:0}}
</style><rect x="1" y="1" width="598" height="298" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect x="1" y="1" width="6" height="298" rx="3" fill="#e3b341"/><clipPath id="bar"><rect x="1" y="1" width="6" height="298" rx="3"/></clipPath><g clip-path="url(#bar)"><rect class="shine" x="1" y="0" width="6" height="90" fill="#e6edf3" opacity=".6"/></g><text x="36" y="50" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#e3b341" text-anchor="start" letter-spacing="1">КОММЕРЧЕСКИЙ · BACKEND</text><text x="568" y="50" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="400" fill="#8b949e" text-anchor="end">smip.site ↗</text><circle class="ring" cx="455" cy="45" r="4.5" fill="none" stroke="#e3b341" stroke-width="2"/><circle class="ring d" cx="455" cy="45" r="4.5" fill="none" stroke="#e3b341" stroke-width="2"/><circle cx="455" cy="45" r="4.5" fill="#e3b341"/><text x="36" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3" text-anchor="start">SMIP Platform</text><text x="36" y="140" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="start">SaaS-аналитика для контент-команд.</text><text x="36" y="168" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="start">REST API, JWT с ротацией refresh-сессий,</text><text x="36" y="196" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#8b949e" text-anchor="start">парсинг соцсетей через RabbitMQ, outbox и DLQ.</text><rect x="36" y="236" width="83" height="30" rx="6" fill="#21262d" stroke="#30363d"/><text x="48" y="255.9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">FastAPI</text><rect x="126.8" y="236" width="108" height="30" rx="6" fill="#21262d" stroke="#30363d"/><text x="138.8" y="255.9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">PostgreSQL</text><rect x="242.8" y="236" width="108" height="30" rx="6" fill="#21262d" stroke="#30363d"/><text x="254.8" y="255.9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">ClickHouse</text><rect x="358.8" y="236" width="91" height="30" rx="6" fill="#21262d" stroke="#30363d"/><text x="370.8" y="255.9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">RabbitMQ</text></svg>
