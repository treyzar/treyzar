<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ivan · treyzar — Python Backend Developer"><title>Ivan · treyzar — Python Backend Developer</title><style>
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
